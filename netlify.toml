[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Increase serverless function timeout to 26s (max on free tier)
# Prevents heavy routes (daily-summary, monthly-report-card, report) from timing out
[functions]
  included_files = ["lib/**"]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
